      font-weight: 400;
    }

    @media (max-width: 520px) {
      #beads-event-factory .bef-motion-note {
        display: none;
      }
    }
  </style>

  <div class="bef-header">
    <h2>Beads event factory</h2>
    <div class="viz-controls bef-controls">
      <select class="bef-city-select" id="bef-city" aria-label="Gas City"></select>
      <button class="btn" id="bef-refresh" type="button">Refresh</button>
      <button class="btn" id="bef-showcase" type="button">Showcase</button>
      <button class="btn" id="bef-mode" type="button">Demo events</button>
      <button class="btn btn-primary" id="bef-next-event" type="button" hidden>Run next event</button>
    </div>
  </div>

  <div class="bef-event-line text-small" id="bef-event-line" aria-live="polite">
    Connecting to Gas City…
  </div>

  <div class="bef-toolbar" id="bef-toolbar">
    <input id="bef-search" type="search" placeholder="Find by ID, title, assignee, or label" aria-label="Find a bead">
    <select id="bef-type" aria-label="Filter by bead type"><option value="">All types</option></select>
    <label class="bef-check"><input id="bef-closed" type="checkbox"> Include closed</label>
  </div>

  <div class="bef-stage card" id="bef-stage">
    <canvas id="bef-canvas" tabindex="0" role="img" aria-label="Animated Beads factory with a blocked funnel, open bin, articulated crane claws, closed bin, and floor for deferred or rejected work. Hover or click a bead for details."></canvas>
    <div class="bef-motion-note text-small" id="bef-motion-note">Gravity on</div>
    <div class="bef-tooltip" id="bef-tooltip" role="tooltip" hidden></div>
    <aside class="bef-details" id="bef-details" aria-label="Bead details" hidden>
      <div class="bef-details-header">
        <div><span class="bef-details-id" id="bef-details-id"></span><h3 id="bef-details-title">Bead details</h3></div>
        <button class="bef-details-close" id="bef-details-close" type="button" aria-label="Close bead details">×</button>
      </div>
      <div class="bef-details-body" id="bef-details-body"></div>
    </aside>
  </div>

  <script>
    (() => {
      const root = document.getElementById('beads-event-factory');
      const stage = root.querySelector('#bef-stage');
      const canvas = root.querySelector('#bef-canvas');
      const ctx = canvas.getContext('2d');
      const nextButton = root.querySelector('#bef-next-event');
      const eventLine = root.querySelector('#bef-event-line');
      const motionNote = root.querySelector('#bef-motion-note');
      const citySelect = root.querySelector('#bef-city');
      const refreshButton = root.querySelector('#bef-refresh');
      const showcaseButton = root.querySelector('#bef-showcase');
      const modeButton = root.querySelector('#bef-mode');
      const toolbar = root.querySelector('#bef-toolbar');
      const searchInput = root.querySelector('#bef-search');
      const typeSelect = root.querySelector('#bef-type');
      const closedToggle = root.querySelector('#bef-closed');
      const tooltip = root.querySelector('#bef-tooltip');
      const details = root.querySelector('#bef-details');
      const detailsID = root.querySelector('#bef-details-id');
      const detailsTitle = root.querySelector('#bef-details-title');
      const detailsBody = root.querySelector('#bef-details-body');
      const detailsClose = root.querySelector('#bef-details-close');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pollParameter = new URLSearchParams(location.search).get('poll');
      const requestedPollMs = pollParameter === null ? Number.NaN : Number(pollParameter);
      const livePollMs = Number.isFinite(requestedPollMs)
        ? Math.min(60000, Math.max(500, requestedPollMs))
        : 15000;
      const livePollLabel = livePollMs >= 1000 && livePollMs % 1000 === 0
        ? `${livePollMs / 1000}s`
        : `${livePollMs}ms`;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let lastTime = 0;
      let frameRequested = false;
      let initialized = false;
      let step = 0;
      let blockedGateOpen = false;
      let rejectedPulse = 0;
      let viewMode = 'demo';
      let liveRecords = [];
      let liveAgents = [];
      let liveTotal = 0;
      let liveRequest = 0;
      let liveTimer = 0;
      let showcaseTimer = 0;
      let showcaseStep = 0;
      let showcaseEpoch = 0;
      let hoveredBead = null;
      let selectedBead = null;
      const tweens = [];
      const beads = [];
      const liveActivityByBead = new Map();
      const liveAgentOutputs = new Map();
      const showcaseCancelled = Symbol('showcase-cancelled');

      const mainClaw = { x: 0, y: 0, open: 1, homeX: 0, homeY: 0, sway: 0, swayVelocity: 0, lastX: 0, visible: false };
      const workClaw = { x: 0, y: 0, open: 0, homeX: 0, homeY: 0, sway: 0, swayVelocity: 0, lastX: 0, visible: true };
      const liveWorkClaws = [];

      const paletteProbe = document.createElement('span');
      paletteProbe.style.position = 'absolute';
      paletteProbe.style.visibility = 'hidden';
      root.appendChild(paletteProbe);

      function color(token) {
        paletteProbe.style.color = `var(${token})`;
        return getComputedStyle(paletteProbe).color;
      }

      function palette() {
        return {
          background: color('--bef-ink'),
          dark: color('--bef-dark'),
          surface: color('--bef-surface'),
          surfaceStrong: color('--bef-surface-strong'),
          foreground: color('--bef-text'),
          muted: color('--bef-silver'),
          chrome: color('--bef-chrome'),
          blue: color('--bef-blue'),
          plasma: color('--bef-plasma'),
          grid: color('--bef-grid'),
          yellow: color('--bef-gold-bright'),
          brass: color('--bef-brass'),
          spark: color('--bef-spark'),
          red: color('--bef-red')
        };
      }

      function layout() {
        const blockedCenter = width * 0.105;
        const blockedHalfWidth = width < 520 ? 14 : 17;
        const railY = height * 0.065;
        const floorY = height * 0.89;
        const blockedTop = height * 0.22;
        const open = {
          left: width * 0.095,
          right: width * 0.34,
          top: height * 0.56,
          bottom: height * 0.79
        };
        const closed = {
          left: width * 0.76,
          right: width * 0.955,
          top: height * 0.56,
          bottom: height * 0.79
        };
        const workGap = closed.left - open.right;
        return {
          railY,
          floorY,
          blocked: {
            left: blockedCenter - blockedHalfWidth,
            right: blockedCenter + blockedHalfWidth,
            center: blockedCenter,
            top: blockedTop,
            bottom: height * 0.49
          },
          open,
          closed,
          progress: {
            firstX: open.right + workGap * 0.34,
            secondX: open.right + workGap * 0.68,
            homeY: railY + (open.top - railY) * 0.61,
            travelY: Math.min(blockedTop - 22, railY + 44)
          },
          rut: {
            left: width * 0.5,
            right: width * 0.63,
            center: width * 0.565,
            depth: 12
          }
        };
      }

      function groundHeightAt(x) {
        const box = layout();
        const { left, right, depth } = box.rut;
        if (x <= left || x >= right) return box.floorY;
        const progress = (x - left) / (right - left);
        return box.floorY + Math.sin(progress * Math.PI) * depth;
      }

      function makeBead(id, status, x, y, options = {}) {
        const bead = {
          id,
          status,
          record: options.record || {
            id,
            title: options.title || id,
            status,
            issue_type: options.issueType || 'task'
          },
          x,
          y,
          vx: 0,
          vy: 0,
          baseRadius: options.radius || 10,
          radius: Math.min(options.radius || 10, width < 520 ? 8 : 10),
          dynamic: false,
          visible: options.visible !== false,
          heldBy: options.heldBy || null,
          settledFor: 0,
          progressPulse: 0,
          activityPulse: 0,
          commentPulse: 0,
          scale: 1,
          source: options.source || 'demo'
        };
        beads.push(bead);
        return bead;
      }

      function findBead(id) {
        return beads.find((bead) => bead.id === id);
      }

      function initializeScene() {
        const box = layout();
        beads.length = 0;
        liveWorkClaws.length = 0;

        mainClaw.homeX = box.progress.firstX;
        mainClaw.homeY = box.progress.homeY;
        mainClaw.x = -45;
        mainClaw.y = mainClaw.homeY;
        mainClaw.open = 1;
        mainClaw.sway = 0;
        mainClaw.swayVelocity = 0;
        mainClaw.lastX = mainClaw.x;
        mainClaw.visible = false;

        workClaw.homeX = box.progress.secondX;
        workClaw.homeY = box.progress.homeY;
        workClaw.x = workClaw.homeX;
        workClaw.y = workClaw.homeY;
        workClaw.open = 0;
        workClaw.sway = 0;
        workClaw.swayVelocity = 0;
        workClaw.lastX = workClaw.x;
        workClaw.visible = true;

        makeBead('b-14', 'blocked', box.blocked.center, box.blocked.bottom - 12, { title: 'Waiting on a blocking dependency' });
        makeBead('b-15', 'blocked', box.blocked.center, box.blocked.bottom - 33, { title: 'Blocked implementation task' });
        makeBead('b-16', 'blocked', box.blocked.center, box.blocked.bottom - 54, { title: 'Blocked validation task' });
        makeBead('b-17', 'open', box.open.left + (box.open.right - box.open.left) * 0.3, box.open.bottom - 12, { title: 'Ready work item' });
        makeBead('b-22', 'open', box.open.left + (box.open.right - box.open.left) * 0.65, box.open.bottom - 12, { title: 'Open work item' });
        makeBead('b-08', 'in_progress', workClaw.x, workClaw.y + 27, { heldBy: workClaw, title: 'Claimed work item' });
        makeBead('b-02', 'closed', box.closed.left + (box.closed.right - box.closed.left) * 0.3, box.closed.bottom - 12, { title: 'Completed work item' });
        makeBead('b-03', 'closed', box.closed.left + (box.closed.right - box.closed.left) * 0.68, box.closed.bottom - 12, { title: 'Closed work item' });
        makeBead('b-11', 'deferred', box.rut.center, groundHeightAt(box.rut.center) - 12, { title: 'Deferred work item' });
        makeBead('b-31', 'open', (box.open.left + box.open.right) / 2, box.open.top - 45, { visible: false, title: 'Newly created work item' });

        blockedGateOpen = false;
        rejectedPulse = 0;
        tweens.length = 0;
        step = 0;
        initialized = true;
        draw();
      }

      function resize() {
        const rect = stage.getBoundingClientRect();
        const oldWidth = width || rect.width;
        const oldHeight = height || rect.height;
        width = Math.max(320, rect.width);
        height = rect.height;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!initialized) {
          initializeScene();
          return;
        }

        const scaleX = width / oldWidth;
        const scaleY = height / oldHeight;
        beads.forEach((bead) => {
          bead.x *= scaleX;
          bead.y *= scaleY;
          bead.radius = Math.min(bead.baseRadius, width < 520 ? 8 : 10);
        });
        [mainClaw, workClaw, ...liveWorkClaws].forEach((claw) => {
          claw.x *= scaleX;
          claw.y *= scaleY;
          claw.homeX *= scaleX;
          claw.homeY *= scaleY;
          claw.lastX = claw.x;
        });
        draw();
      }

      function roundedRect(x, y, w, h, radius) {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawLabel(text, x, y, align = 'left', tone = 'foreground') {
        const p = palette();
        ctx.fillStyle = p[tone];
        ctx.font = `${width < 520 ? 11 : 12}px "IBM Plex Mono", monospace`;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y);
      }

      function drawFactory() {
        const p = palette();
        const box = layout();
        ctx.clearRect(0, 0, width, height);

        const background = ctx.createLinearGradient(0, 0, width, height);
        background.addColorStop(0, p.surface);
        background.addColorStop(0.46, p.dark);
        background.addColorStop(1, p.background);
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = p.grid;
        ctx.lineWidth = 1;
        for (let x = 24; x < width; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 24; y < height; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        ctx.strokeStyle = p.chrome;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(0, box.railY);
        ctx.lineTo(width, box.railY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, box.floorY);
        ctx.lineTo(box.rut.left, box.floorY);
        ctx.quadraticCurveTo(box.rut.center, box.floorY + box.rut.depth * 2, box.rut.right, box.floorY);
        ctx.lineTo(width, box.floorY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(box.blocked.left, box.blocked.bottom);
        ctx.lineTo(box.blocked.left, box.blocked.top);
        ctx.moveTo(box.blocked.left - 4, box.blocked.top);
        ctx.lineTo(box.blocked.left + 5, box.blocked.top);
        ctx.moveTo(box.blocked.right, box.blocked.bottom);
        ctx.lineTo(box.blocked.right, box.blocked.top);
        ctx.moveTo(box.blocked.right - 5, box.blocked.top);
        ctx.lineTo(box.blocked.right + 4, box.blocked.top);
        if (!blockedGateOpen) {
          ctx.moveTo(box.blocked.left, box.blocked.bottom);
          ctx.lineTo(box.blocked.right, box.blocked.bottom);
        }
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(box.open.left, box.open.top);
        ctx.lineTo(box.open.left, box.open.bottom);
        ctx.lineTo(box.open.right, box.open.bottom);
        ctx.lineTo(box.open.right, box.open.top);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(box.closed.left, box.closed.top);
        ctx.lineTo(box.closed.left, box.closed.bottom);
        ctx.lineTo(box.closed.right, box.closed.bottom);
        ctx.lineTo(box.closed.right, box.closed.top);
        ctx.stroke();

        drawLabel(`BLOCKED · ${countStatus('blocked')}`, box.blocked.right + 8, box.blocked.top + 10, 'left', 'yellow');
        drawLabel(`OPEN · ${countStatus('open')}`, box.open.right - 4, box.open.top - 18, 'right', 'yellow');
        drawLabel(`IN PROGRESS · ${countStatus('in_progress')}`, width * 0.53, box.railY - 14, 'center', 'yellow');
        drawLabel(`CLOSED · ${countClosed()}`, box.closed.right - 4, box.closed.top - 38, 'right', 'yellow');
        drawLabel(`DEFERRED / FAILED CLOSE · ${countGround()}`, box.rut.center, box.floorY + 28, 'center', 'muted');
      }

      function hookPosition(claw) {
        const cableLength = Math.max(20, claw.y - layout().railY - 7);
        return {
          x: claw.x + Math.sin(claw.sway) * cableLength,
          y: claw.y
        };
      }

      function drawClaw(claw) {
        if (!claw.visible) return;
        const p = palette();
        const hook = hookPosition(claw);
        const spread = 15 + claw.open * 10;
        const tip = 12 + claw.open * 9;

        ctx.strokeStyle = p.chrome;
        ctx.fillStyle = p.surfaceStrong;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        roundedRect(claw.x - 17, layout().railY - 7, 34, 14, 4);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(claw.x, layout().railY + 7);
        ctx.lineTo(hook.x, hook.y - 24);
        ctx.stroke();

        ctx.save();
        ctx.translate(hook.x, hook.y);
        ctx.rotate(claw.sway * 0.45);

        roundedRect(-10, -29, 20, 12, 5);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-7, -17);
        ctx.lineTo(-spread, -5);
        ctx.lineTo(-tip, 14);
        ctx.lineTo(-6, 19);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(7, -17);
        ctx.lineTo(spread, -5);
        ctx.lineTo(tip, 14);
        ctx.lineTo(6, 19);
        ctx.stroke();

        ctx.fillStyle = p.brass;
        ctx.beginPath();
        ctx.arc(-spread, -5, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(spread, -5, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawBead(bead) {
        if (!bead.visible) return;
        const p = palette();
        const radius = bead.radius * bead.scale;
        if (bead.heldBy) {
          const hook = hookPosition(bead.heldBy);
          const rotation = bead.heldBy.sway * 0.45;
          bead.x = hook.x + Math.sin(rotation) * 28;
          bead.y = hook.y + Math.cos(rotation) * 28;
        }

        if (bead.status === 'in_progress') {
          ctx.strokeStyle = p.plasma;
          ctx.globalAlpha = 0.42;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(bead.x, bead.y, bead.radius + 6, 0, Math.PI * 2);
          ctx.stroke();

          if (bead.progressPulse > 0) {
            ctx.strokeStyle = p.yellow;
            ctx.globalAlpha = bead.progressPulse * 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(bead.x, bead.y, bead.radius + 8 + (1 - bead.progressPulse) * 18, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }

        if (bead.activityPulse > 0) {
          ctx.strokeStyle = p.blue;
          ctx.globalAlpha = bead.activityPulse * 0.72;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(bead.x, bead.y, radius + 7 + (1 - bead.activityPulse) * 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (bead === hoveredBead || bead === selectedBead) {
          ctx.strokeStyle = bead === selectedBead ? p.spark : p.plasma;
          ctx.globalAlpha = 0.9;
          ctx.lineWidth = bead === selectedBead ? 3 : 2;
          ctx.beginPath();
          ctx.arc(bead.x, bead.y, radius + 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        ctx.fillStyle = p.yellow;
        ctx.strokeStyle = bead.status === 'failed' ? p.red : p.brass;
        ctx.lineWidth = bead.status === 'failed' ? 3 : 2;
        ctx.beginPath();
        ctx.arc(bead.x, bead.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = p.foreground;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(bead.x - radius * 0.3, bead.y - radius * 0.35, radius * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (bead.status === 'failed' && rejectedPulse > 0) {
          ctx.strokeStyle = p.red;
          ctx.globalAlpha = Math.max(0, rejectedPulse);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(bead.x, bead.y, bead.radius + (1 - rejectedPulse) * 22, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        if (bead.commentPulse > 0) {
          const bubbleWidth = 29;
          const bubbleHeight = 20;
          const bubbleX = bead.x + radius + 5;
          const bubbleY = bead.y - radius - 24;
          ctx.globalAlpha = Math.min(1, bead.commentPulse * 1.8);
          ctx.fillStyle = p.surfaceStrong;
          ctx.strokeStyle = p.chrome;
          ctx.lineWidth = 1.5;
          roundedRect(bubbleX, bubbleY, bubbleWidth, bubbleHeight, 6);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(bubbleX + 5, bubbleY + bubbleHeight - 1);
          ctx.lineTo(bubbleX + 1, bubbleY + bubbleHeight + 6);
          ctx.lineTo(bubbleX + 11, bubbleY + bubbleHeight - 1);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = p.foreground;
          ctx.font = '14px "IBM Plex Mono", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('…', bubbleX + bubbleWidth / 2, bubbleY + bubbleHeight / 2 - 2);
          ctx.globalAlpha = 1;
        }
      }

      function draw() {
        drawFactory();
        if (viewMode === 'live' || viewMode === 'showcase') liveWorkClaws.forEach(drawClaw);
        else {
          drawClaw(mainClaw);
          drawClaw(workClaw);
        }
        beads.forEach(drawBead);
      }

      function countStatus(status) {
        return beads.filter((bead) => bead.visible && bead.status === status).length;
      }

      function countClosed() {
        return beads.filter((bead) => bead.visible && bead.status === 'closed').length;
      }

      function countGround() {
        return beads.filter((bead) => bead.visible && (bead.status === 'deferred' || bead.status === 'failed')).length;
      }

      function physicsRegion(bead) {
        const box = layout();
        if (bead.status === 'open') return box.open;
        if (bead.status === 'blocked') {
          return { left: box.blocked.left, right: box.blocked.right, bottom: box.blocked.bottom };
        }
        if (bead.status === 'closed') return box.closed;
        return { left: 0, right: width, bottom: groundHeightAt(bead.x) };
      }

      function updatePhysics(dt) {
        let active = false;
        const gravity = 980;

        beads.forEach((bead) => {
          if (!bead.visible || bead.heldBy || !bead.dynamic) return;
          active = true;
          const region = physicsRegion(bead);
          bead.vy += gravity * dt;
          bead.x += bead.vx * dt;
          bead.y += bead.vy * dt;
          bead.vx *= Math.pow(0.985, dt * 60);

          if (bead.x - bead.radius < region.left) {
            bead.x = region.left + bead.radius;
            bead.vx = Math.abs(bead.vx) * 0.5;
          }
          if (bead.x + bead.radius > region.right) {
            bead.x = region.right - bead.radius;
            bead.vx = -Math.abs(bead.vx) * 0.5;
          }
          if (bead.y + bead.radius >= region.bottom) {
            bead.y = region.bottom - bead.radius;
            if (Math.abs(bead.vy) > 45) {
              bead.vy *= -0.32;
              bead.vx *= 0.72;
            } else {
              bead.vy = 0;
              bead.vx *= 0.7;
            }
          }

          if (Math.abs(bead.vx) < 3 && Math.abs(bead.vy) < 3 && bead.y + bead.radius >= region.bottom - 0.5) {
            bead.settledFor += dt;
            if (bead.settledFor > 0.28) bead.dynamic = false;
          } else {
            bead.settledFor = 0;
          }
        });

        if (active) resolveBeadCollisions();

        return active;
      }

      function collisionGroup(bead) {
        if (bead.status === 'deferred' || bead.status === 'failed') return 'ground';
        return bead.status;
      }

      function resolveBeadCollisions() {
        const candidates = beads.filter((bead) => bead.visible && !bead.heldBy);
        for (let first = 0; first < candidates.length; first += 1) {
          for (let second = first + 1; second < candidates.length; second += 1) {
            const a = candidates[first];
            const b = candidates[second];
            if (collisionGroup(a) !== collisionGroup(b)) continue;

            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let distance = Math.hypot(dx, dy);
            const minimum = a.radius + b.radius + 1;
            if (distance >= minimum) continue;
            if (distance < 0.001) {
              dx = 1;
              dy = 0;
              distance = 1;
            }

            const nx = dx / distance;
            const ny = dy / distance;
            const correction = (minimum - distance) / 2;
            a.x -= nx * correction;
            a.y -= ny * correction;
            b.x += nx * correction;
            b.y += ny * correction;

            const separatingVelocity = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (separatingVelocity < 0) {
              const impulse = -separatingVelocity * 0.58;
              a.vx -= impulse * nx;
              a.vy -= impulse * ny;
              b.vx += impulse * nx;
              b.vy += impulse * ny;
            }
            a.dynamic = true;
            b.dynamic = true;
            a.settledFor = 0;
            b.settledFor = 0;
          }
        }
      }

      function updateTweens(now) {
        if (!tweens.length) return false;
        for (let index = tweens.length - 1; index >= 0; index -= 1) {
          const tween = tweens[index];
          const raw = Math.min(1, (now - tween.start) / tween.duration);
          const eased = raw < 0.5 ? 4 * raw * raw * raw : 1 - Math.pow(-2 * raw + 2, 3) / 2;
          tween.update(eased);
          if (raw >= 1) {
            tweens.splice(index, 1);
            tween.resolve();
          }
        }
        return tweens.length > 0;
      }

      function updateClawDynamics(dt) {
        let active = false;
        const activeClaws = viewMode === 'live' || viewMode === 'showcase'
          ? liveWorkClaws
          : [mainClaw, workClaw];
        activeClaws.forEach((claw) => {
          if (!claw.visible) return;
          if (viewMode === 'live' && claw.working && !reducedMotion) {
            claw.workPhase = (claw.workPhase + dt * 5.2) % (Math.PI * 2);
            claw.y = claw.homeY + Math.sin(claw.workPhase) * 2.5;
            active = true;
          } else if (viewMode === 'live' && claw.workPhase) {
            claw.workPhase = 0;
            claw.y = claw.homeY;
          }
          const speed = (claw.x - claw.lastX) / Math.max(dt, 0.001);
          const target = Math.max(-0.16, Math.min(0.16, -speed * 0.00032));
          claw.swayVelocity += (target - claw.sway) * 36 * dt;
          claw.swayVelocity *= Math.exp(-6.5 * dt);
          claw.sway += claw.swayVelocity * dt;
          claw.lastX = claw.x;
          if (Math.abs(claw.sway) > 0.001 || Math.abs(claw.swayVelocity) > 0.001 || Math.abs(target) > 0.001) {
            active = true;
          }
        });
        return active;
      }

      function updateEffects(dt) {
        let active = false;
        beads.forEach((bead) => {
          if (bead.progressPulse > 0) {
            bead.progressPulse = Math.max(0, bead.progressPulse - dt * 1.35);
            if (bead.progressPulse > 0) active = true;
          }
          if (bead.activityPulse > 0) {
            bead.activityPulse = Math.max(0, bead.activityPulse - dt * 1.15);
            if (bead.activityPulse > 0) active = true;
          }
          if (bead.commentPulse > 0) {
            bead.commentPulse = Math.max(0, bead.commentPulse - dt * 0.75);
            if (bead.commentPulse > 0) active = true;
          }
        });
        return active;
      }

      function animateFrame(now) {
        frameRequested = false;
        const dt = Math.min(0.032, Math.max(0.001, (now - lastTime) / 1000 || 0.016));
        lastTime = now;
        const tweening = updateTweens(now);
        const swaying = updateClawDynamics(dt);
        const moving = updatePhysics(dt);
        const effects = updateEffects(dt);
        if (rejectedPulse > 0) rejectedPulse = Math.max(0, rejectedPulse - dt * 1.25);
        draw();
        if (tweening || swaying || moving || effects || rejectedPulse > 0) requestFrame();
      }

      function requestFrame() {
        if (frameRequested) return;
        frameRequested = true;
        requestAnimationFrame(animateFrame);
      }

      function tween(duration, update) {
        if (reducedMotion) {
          update(1);
          draw();
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          tweens.push({ start: performance.now(), duration, update, resolve });
          requestFrame();
        });
      }

      function moveClawHorizontal(claw, targetX, duration = 650) {
        const startX = claw.x;
        if (Math.abs(targetX - startX) < 0.5) return Promise.resolve();
        return tween(duration, (amount) => {
          claw.x = startX + (targetX - startX) * amount;
        });
      }

      function moveClawVertical(claw, targetY, duration = 520) {
        const startY = claw.y;
        return tween(duration, (amount) => {
          claw.y = startY + (targetY - startY) * amount;
        });
      }

      function articulateClaw(claw, targetOpen, duration = 260) {
        const startOpen = claw.open;
        return tween(duration, (amount) => {
          claw.open = startOpen + (targetOpen - startOpen) * amount;
        });
      }

      function recoilClaw(claw, distance = 8) {
        const startY = claw.y;
        return tween(280, (amount) => {
          claw.y = startY - Math.sin(amount * Math.PI) * distance;
        });
      }

      async function enterClaw(claw, restX) {
        const travelY = layout().progress.travelY;
        claw.visible = true;
        claw.x = -45;
        claw.y = travelY;
        claw.open = 1;
        claw.sway = 0;
        claw.swayVelocity = 0;
        claw.lastX = claw.x;
        draw();
        await moveClawHorizontal(claw, restX, 820);
      }

      async function exitClaw(claw) {
        const travelY = layout().progress.travelY;
        if (Math.abs(claw.y - travelY) > 1) await moveClawVertical(claw, travelY, 440);
        await moveClawHorizontal(claw, -45, 760);
        claw.visible = false;
        draw();
      }

      async function pickBead(claw, bead) {
        const travelY = layout().progress.travelY;
        bead.dynamic = false;
        await moveClawHorizontal(claw, bead.x, 650);
        await moveClawVertical(claw, bead.y - 28, 520);
        await articulateClaw(claw, 0, 260);
        bead.heldBy = claw;
        bead.status = 'in_progress';
        bead.progressPulse = 1;
        requestFrame();
        await recoilClaw(claw, 8);
        await moveClawVertical(claw, travelY, 540);
      }

      async function dropBead(claw, bead, targetX, targetY, status) {
        const travelY = layout().progress.travelY;
        if (Math.abs(claw.y - travelY) > 1) await moveClawVertical(claw, travelY, 440);
        await moveClawHorizontal(claw, targetX, 760);
        await wait(150);
        await moveClawVertical(claw, targetY, 480);
        await articulateClaw(claw, 1, 260);
        release(bead, status, claw.sway * width * 0.3, 15);
        await wait(850);
        await moveClawVertical(claw, travelY, 500);
      }

      function release(bead, status, vx = 0, vy = 0) {
        if (bead.heldBy) {
          const hook = hookPosition(bead.heldBy);
          const rotation = bead.heldBy.sway * 0.45;
          bead.x = hook.x + Math.sin(rotation) * 28;
          bead.y = hook.y + Math.cos(rotation) * 28;
        }
        bead.heldBy = null;
        bead.status = status;
        bead.vx = vx;
        bead.vy = vy;
        bead.dynamic = true;
        bead.settledFor = 0;
        requestFrame();
      }

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, reducedMotion ? 20 : milliseconds));
      }

      async function spawnOpen() {
        const bead = findBead('b-31');
        const box = layout();
        bead.visible = true;
        bead.status = 'open';
        bead.x = (box.open.left + box.open.right) / 2;
        bead.y = box.open.top - 50;
        bead.vx = -12;
        bead.vy = 0;
        bead.dynamic = true;
        requestFrame();
        await wait(1100);
      }

      async function claimOpenBead() {
        const bead = findBead('b-31');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await moveClawHorizontal(mainClaw, box.progress.firstX, 680);
        await moveClawVertical(mainClaw, box.progress.homeY, 500);
        mainClaw.homeX = box.progress.firstX;
        bead.progressPulse = 1;
        requestFrame();
        await wait(550);
      }

      async function unclaimBead() {
        const bead = findBead('b-31');
        const box = layout();
        await dropBead(
          mainClaw,
          bead,
          box.open.left + (box.open.right - box.open.left) * 0.78,
          box.open.top - 52,
          'open'
        );
        await exitClaw(mainClaw);
      }

      async function addBlockingDependency() {
        const bead = findBead('b-31');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await dropBead(mainClaw, bead, box.blocked.center, box.blocked.top - 31, 'blocked');
        await exitClaw(mainClaw);
      }

      async function releaseBlocked() {
        const bead = findBead('b-14');
        const box = layout();
        blockedGateOpen = true;
        bead.status = 'open';
        bead.x = box.blocked.center;
        bead.y = box.blocked.bottom + 3;
        bead.vx = 18;
        bead.vy = 15;
        bead.dynamic = true;
        findBead('b-15').dynamic = true;
        findBead('b-16').dynamic = true;
        requestFrame();
        await wait(900);
        blockedGateOpen = false;
        draw();
      }

      async function transferOpenToClosed() {
        const bead = findBead('b-17');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await dropBead(
          mainClaw,
          bead,
          (box.closed.left + box.closed.right) / 2,
          box.closed.top - 55,
          'closed'
        );
        await exitClaw(mainClaw);
      }

      async function deferBead() {
        const bead = findBead('b-22');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await dropBead(mainClaw, bead, box.rut.center, box.floorY - 95, 'deferred');
        await exitClaw(mainClaw);
      }

      async function wakeDeferredBead() {
        const bead = findBead('b-22');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await dropBead(
          mainClaw,
          bead,
          box.open.left + (box.open.right - box.open.left) * 0.52,
          box.open.top - 52,
          'open'
        );
        await exitClaw(mainClaw);
      }

      async function rejectWork() {
        const bead = findBead('b-08');
        await articulateClaw(workClaw, 1, 280);
        release(bead, 'failed', width * 0.08, 20);
        rejectedPulse = 1;
        requestFrame();
        await wait(1050);
        await exitClaw(workClaw);
      }

      async function reopenBead() {
        const bead = findBead('b-02');
        const box = layout();
        await enterClaw(mainClaw, bead.x);
        await pickBead(mainClaw, bead);
        await dropBead(
          mainClaw,
          bead,
          box.open.left + (box.open.right - box.open.left) * 0.26,
          box.open.top - 52,
          'open'
        );
        await exitClaw(mainClaw);
      }

      async function deleteBead() {
        const bead = findBead('b-03');
        bead.activityPulse = 1;
        requestFrame();
        await wait(420);
        const startScale = bead.scale;
        await tween(620, (amount) => {
          bead.scale = startScale * (1 - amount);
        });
        bead.visible = false;
        bead.status = 'deleted';
        draw();
      }

      async function commentOnBead() {
        const bead = findBead('b-22');
        bead.activityPulse = 1;
        bead.commentPulse = 1;
        requestFrame();
        await wait(1350);
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      }

      function option(text, value) {
        const node = element('option', '', text);
        node.value = value;
        return node;
      }

      async function fetchJSON(path) {
        const response = await fetch(path, { headers: { accept: 'application/json' } });
        let data;
        try {
          data = await response.json();
        } catch {
          data = { error: `${response.status} ${response.statusText}` };
        }
        if (!response.ok) throw new Error(data.detail || data.error || `${response.status} ${response.statusText}`);
        return data;
      }

      function liveStatus(record) {
        const failed = record.status === 'closed' && (
          record.metadata?.['gc.outcome'] === 'fail' ||
          record.metadata?.['gc.work_outcome'] === 'failed' ||
          /failed|failure/i.test(record.metadata?.close_reason || '')
        );
        if (failed) return 'failed';
        if (record.status === 'closed') return 'closed';
        if (record.defer_until && new Date(record.defer_until) > new Date()) return 'deferred';
        if (record.status === 'in_progress') return 'in_progress';
        if (record.is_blocked === true) return 'blocked';
        return 'open';
      }

      function showcaseRecord(index, category, step) {
        const id = `showcase-${String(index + 1).padStart(2, '0')}`;
        const names = ['open', 'in progress', 'blocked', 'deferred', 'closed', 'failed close'];
        const base = {
          id,
          title: `${names[category]} example ${index + 1}`,
          issue_type: index % 3 === 0 ? 'bug' : index % 3 === 1 ? 'feature' : 'task',
          priority: index % 5,
          labels: ['showcase', names[category].replaceAll(' ', '-')],
          description: `Synthetic showcase record. Transition ${step}; this is not city data.`,
          metadata: { showcase: true, transition: step }
        };
        if (category === 1) return { ...base, status: 'in_progress', assignee: `worker-${index % 5 + 1}` };
        if (category === 2) return { ...base, status: 'open', is_blocked: true };
        if (category === 3) return { ...base, status: 'open', defer_until: '2099-01-01T00:00:00Z' };
        if (category === 4) return { ...base, status: 'closed', metadata: { ...base.metadata, 'gc.work_outcome': 'passed' } };
        if (category === 5) return { ...base, status: 'closed', metadata: { ...base.metadata, 'gc.work_outcome': 'failed' } };
        return { ...base, status: 'open' };
      }

      function showcaseRecords(step) {
        return Array.from({ length: 30 }, (_, index) => {
          const homeCategory = Math.floor(index / 5);
          const category = index % 5 === 0 ? (homeCategory + step) % 6 : homeCategory;
          return showcaseRecord(index, category, step);
        });
      }

      function ensureShowcaseActive(epoch) {
        if (viewMode !== 'showcase' || epoch !== showcaseEpoch) throw showcaseCancelled;
      }

      async function awaitShowcase(promise, epoch) {
        await promise;
        ensureShowcaseActive(epoch);
      }

      async function pauseShowcase(milliseconds, epoch) {
        await new Promise((resolve) => window.setTimeout(resolve, reducedMotion ? 0 : milliseconds));
        ensureShowcaseActive(epoch);
      }

      function showcaseDestination(record, records) {
        const box = layout();
        const status = liveStatus(record);
        const sameStatus = records.filter((candidate) => liveStatus(candidate) === status);
        const index = Math.max(0, sameStatus.findIndex((candidate) => candidate.id === record.id));
        const fraction = (index + 1) / (sameStatus.length + 1);

        if (status === 'in_progress') {
          const workLeft = box.open.right + 34;
          const workRight = box.closed.left - 34;
          return {
            status,
            x: sameStatus.length === 1 ? box.progress.secondX : workLeft + index * (workRight - workLeft) / (sameStatus.length - 1),
            y: box.progress.homeY,
            held: true
          };
        }
        if (status === 'blocked') {
          return {
            status,
            x: box.blocked.left + 10 + fraction * Math.max(1, box.blocked.right - box.blocked.left - 20),
            y: box.blocked.top - 38
          };
        }
        if (status === 'open') {
          return {
            status,
            x: box.open.left + 12 + fraction * Math.max(1, box.open.right - box.open.left - 24),
            y: box.open.top - 50
          };
        }
        if (status === 'closed') {
          return {
            status,
            x: box.closed.left + 12 + fraction * Math.max(1, box.closed.right - box.closed.left - 24),
            y: box.closed.top - 50
          };
        }

        const groundRecords = records.filter((candidate) => {
          const candidateStatus = liveStatus(candidate);
          return candidateStatus === 'deferred' || candidateStatus === 'failed';
        });
        const groundIndex = Math.max(0, groundRecords.findIndex((candidate) => candidate.id === record.id));
        const groundFraction = (groundIndex + 1) / (groundRecords.length + 1);
        return {
          status,
          x: width * (0.34 + groundFraction * 0.46),
          y: box.floorY - 92
        };
      }

      async function moveShowcaseBead(previousRecord, nextRecord, records, stagger, epoch) {
        await pauseShowcase(stagger * 75, epoch);
        const bead = findBead(previousRecord.id);
        if (!bead) return;

        const travelY = layout().progress.travelY;
        const destination = showcaseDestination(nextRecord, records);
        let claw = bead.heldBy;
        if (!claw) {
          claw = createLiveWorkClaw(bead.id, -45, travelY);
          claw.open = 1;
          claw.visible = true;
          claw.lastX = claw.x;
          liveWorkClaws.push(claw);
          await awaitShowcase(moveClawHorizontal(claw, bead.x, 520), epoch);
          await awaitShowcase(moveClawVertical(claw, bead.y - 28, 360), epoch);
          await awaitShowcase(articulateClaw(claw, 0, 180), epoch);
          bead.dynamic = false;
          bead.vx = 0;
          bead.vy = 0;
          bead.heldBy = claw;
          bead.status = 'in_progress';
          bead.progressPulse = 1;
          requestFrame();
        }

        await awaitShowcase(moveClawVertical(claw, travelY, 380), epoch);
        await awaitShowcase(moveClawHorizontal(claw, destination.x, 720), epoch);

        if (destination.held) {
          await awaitShowcase(moveClawVertical(claw, destination.y, 380), epoch);
          claw.homeX = destination.x;
          claw.homeY = destination.y;
          claw.open = 0;
          claw.beadID = bead.id;
          bead.record = nextRecord;
          bead.status = 'in_progress';
          bead.dynamic = false;
          return;
        }

        await awaitShowcase(moveClawVertical(claw, destination.y, 340), epoch);
        await awaitShowcase(articulateClaw(claw, 1, 180), epoch);
        bead.record = nextRecord;
        release(bead, destination.status, claw.sway * width * 0.18, 12);
        await awaitShowcase(moveClawVertical(claw, travelY, 360), epoch);
        await awaitShowcase(moveClawHorizontal(claw, -45, 520), epoch);
        claw.visible = false;
      }

      async function animateShowcaseTransition(nextRecords, nextStep, epoch) {
        const nextByID = new Map(nextRecords.map((record) => [record.id, record]));
        const changes = liveRecords.filter((record) => liveStatus(record) !== liveStatus(nextByID.get(record.id)));
        eventLine.textContent = `Showcase · ${changes.length} concurrent claw transfers · transition ${showcaseStep} → ${nextStep}`;
        motionNote.textContent = 'Gravity on · claws moving beads between categories';
        await Promise.all(changes.map((record, index) => (
          moveShowcaseBead(record, nextByID.get(record.id), nextRecords, index, epoch)
        )));
        ensureShowcaseActive(epoch);
      }

      function randomSpawnOffset(radius) {
        const spread = Math.min(4, Math.max(1.5, radius * 0.45));
        return {
          x: (Math.random() * 2 - 1) * spread,
          y: (Math.random() * 2 - 1) * spread * 0.35
        };
      }

      function createLiveWorkClaw(beadID, x, y) {
        return {
          beadID,
          x,
          y,
          open: 0,
          homeX: x,
          homeY: y,
          sway: 0,
          swayVelocity: 0,
          lastX: x,
          working: false,
          workPhase: 0,
          visible: true
        };
      }

      function placeLiveGroup(records, status, area, maximumColumns, placeBead) {
        if (!records.length) return;
        const areaWidth = Math.max(1, area.right - area.left);
        const areaHeight = Math.max(1, area.bottom - area.top);
        const idealColumns = Math.ceil(Math.sqrt(records.length * areaWidth / areaHeight));
        const columns = Math.max(1, Math.min(maximumColumns, records.length, idealColumns));
        const rows = Math.max(1, Math.ceil(records.length / columns));
        const radius = Math.max(4, Math.min(9, areaWidth / columns * 0.28, areaHeight / rows * 0.28));
        records.forEach((record, index) => {
          const column = index % columns;
          const row = Math.floor(index / columns);
          const x = area.left + (column + 0.5) * areaWidth / columns;
          const y = area.bottom - (row + 0.5) * areaHeight / rows;
          placeBead(record, status, x, y, { radius });
        });
      }

      function enableLiveGravity(beadsToActivate) {
        beadsToActivate.forEach((bead) => {
          if (!bead.visible || bead.heldBy || bead.status === 'in_progress') return;
          bead.dynamic = true;
          bead.settledFor = 0;
        });
        if (beadsToActivate.length) requestFrame();
      }

      function matchesLiveFilters(record) {
        const type = typeSelect.value;
        if (type && (record.issue_type || 'task') !== type) return false;
        const search = searchInput.value.trim().toLocaleLowerCase();
        if (!search) return true;
        const text = [
          record.id,
          record.title,
          record.assignee,
          record.description,
          record.issue_type,
          ...(record.labels || [])
        ].filter(Boolean).join(' ').toLocaleLowerCase();
        return text.includes(search);
      }

      function closeDetails() {
        selectedBead = null;
        details.hidden = true;
        draw();
      }

      function applyLiveAgentActivity() {
        liveActivityByBead.clear();
        liveWorkClaws.forEach((claw) => { claw.working = false; });
        if (viewMode !== 'live') return [];

        const activeAgents = liveAgents.filter((agent) => (
          agent.running === true && agent.state === 'working' && agent.active_bead
        ));
        activeAgents.forEach((agent) => {
          const bead = findBead(agent.active_bead) || beads.find((candidate) => candidate.record?.assignee === agent.name);
          if (!bead) return;
          liveActivityByBead.set(bead.id, agent);
          bead.activityPulse = 1;
          if (agent.last_output && liveAgentOutputs.get(agent.name) !== agent.last_output) {
            bead.commentPulse = 1;
            liveAgentOutputs.set(agent.name, agent.last_output);
          }
          if (bead.heldBy) bead.heldBy.working = true;
        });
        if (activeAgents.length) requestFrame();
        return activeAgents;
      }

      function applyLiveRecords() {
        if (!initialized || !width) {
          requestAnimationFrame(applyLiveRecords);
          return;
        }

        const box = layout();
        const visibleRecords = liveRecords.filter(matchesLiveFilters);
        const grouped = {
          blocked: [],
          open: [],
          in_progress: [],
          closed: [],
          deferred: [],
          failed: []
        };
        visibleRecords.forEach((record) => grouped[liveStatus(record)].push(record));

        const previousLiveBeads = new Map(
          beads.filter((bead) => bead.source === 'live').map((bead) => [bead.id, bead])
        );
        const previousLiveClaws = new Map(liveWorkClaws.map((claw) => [claw.beadID, claw]));
        const previousHoveredID = hoveredBead?.id;
        const previousSelectedID = selectedBead?.id;
        const gravityBeads = [];
        beads.length = 0;
        liveWorkClaws.length = 0;
        tweens.length = 0;
        blockedGateOpen = false;
        rejectedPulse = 0;

        const placeLiveBead = (record, status, x, y, options = {}) => {
          const heldBy = options.heldBy || null;
          const existing = previousLiveBeads.get(record.id);
          if (existing) {
            const changedStatus = existing.status !== status;
            const released = existing.heldBy && !heldBy;
            existing.status = status;
            existing.record = record;
            existing.visible = true;
            existing.source = 'live';
            existing.scale = 1;
            existing.baseRadius = options.radius || existing.baseRadius;
            existing.radius = Math.min(existing.baseRadius, width < 520 ? 8 : 10);
            existing.heldBy = heldBy;
            if (heldBy) {
              existing.dynamic = false;
              existing.vx = 0;
              existing.vy = 0;
            } else if (changedStatus || released) {
              gravityBeads.push(existing);
            }
            beads.push(existing);
            return existing;
          }

          const offset = heldBy ? { x: 0, y: 0 } : randomSpawnOffset(options.radius || 9);
          const bead = makeBead(record.id, status, x + offset.x, y + offset.y, {
            ...options,
            heldBy,
            record,
            source: 'live'
          });
          if (!heldBy) gravityBeads.push(bead);
          return bead;
        };

        mainClaw.visible = false;
        mainClaw.x = box.progress.firstX;
        mainClaw.y = box.progress.homeY;
        mainClaw.homeX = box.progress.firstX;
        mainClaw.homeY = box.progress.homeY;
        workClaw.visible = false;
        workClaw.x = box.progress.secondX;
        workClaw.y = box.progress.homeY;
        workClaw.homeX = box.progress.secondX;
        workClaw.homeY = box.progress.homeY;
        workClaw.open = 1;

        placeLiveGroup(grouped.blocked, 'blocked', {
          left: box.blocked.left - 13,
          right: box.blocked.right + 13,
          top: box.blocked.top + 15,
          bottom: box.blocked.bottom - 8
        }, 3, placeLiveBead);
        placeLiveGroup(grouped.open, 'open', {
          left: box.open.left + 9,
          right: box.open.right - 9,
          top: box.open.top + 10,
          bottom: box.open.bottom - 8
        }, 9, placeLiveBead);

        const progressRecords = [...grouped.in_progress];
        const workLeft = box.open.right + 34;
        const workRight = box.closed.left - 34;
        progressRecords.forEach((record, index) => {
          const x = progressRecords.length === 1
            ? box.progress.secondX
            : workLeft + index * (workRight - workLeft) / (progressRecords.length - 1);
          const previousClaw = previousLiveClaws.get(record.id);
          const claw = previousClaw || createLiveWorkClaw(record.id, x, box.progress.homeY);
          const previousX = claw.x;
          claw.beadID = record.id;
          claw.x = x;
          claw.y = box.progress.homeY;
          claw.homeX = x;
          claw.homeY = box.progress.homeY;
          claw.open = 0;
          claw.working = false;
          claw.visible = true;
          claw.lastX = previousX;
          liveWorkClaws.push(claw);
          placeLiveBead(record, 'in_progress', claw.x, claw.y + 27, {
            heldBy: claw,
            radius: 9
          });
        });

        placeLiveGroup(grouped.closed, 'closed', {
          left: box.closed.left + 8,
          right: box.closed.right - 8,
          top: box.closed.top + 10,
          bottom: box.closed.bottom - 8
        }, 8, placeLiveBead);

        const groundRecords = [...grouped.deferred, ...grouped.failed];
        const groundWidth = width * 0.42;
        groundRecords.forEach((record, index) => {
          const columns = Math.min(14, Math.max(1, groundRecords.length));
          const row = Math.floor(index / columns);
          const column = index % columns;
          const x = width * 0.36 + (column + 0.5) * groundWidth / columns;
          const y = groundHeightAt(x) - 8 - row * 15;
          const status = liveStatus(record);
          placeLiveBead(record, status, x, y, { radius: groundRecords.length > 20 ? 5 : 7 });
        });

        const activeAgents = applyLiveAgentActivity();
        enableLiveGravity(gravityBeads);

        hoveredBead = previousHoveredID ? findBead(previousHoveredID) || null : null;
        selectedBead = previousSelectedID ? findBead(previousSelectedID) || null : null;
        if (hoveredBead) showTooltip(hoveredBead);
        else tooltip.hidden = true;
        if (selectedBead) renderDetails(selectedBead.record);
        else details.hidden = true;

        const shown = visibleRecords.length;
        if (viewMode === 'showcase') {
          eventLine.textContent = `Showcase · synthetic category exercise · ${shown} beads · transition ${showcaseStep}`;
          motionNote.textContent = 'Gravity on · showcase · concurrent claw transfers';
        } else {
          const loadedNote = liveRecords.length < liveTotal ? ` · newest ${liveRecords.length} loaded` : '';
          const workingNote = activeAgents.length ? ` · ${activeAgents.length} working` : '';
          eventLine.textContent = `Live · ${citySelect.value} · ${shown} shown of ${liveTotal}${loadedNote}${workingNote} · updated ${new Date().toLocaleTimeString()}`;
          motionNote.textContent = `Gravity on · live city · ${livePollLabel} refresh${workingNote}`;
        }
        draw();
      }

      function updateTypeOptions() {
        const selected = typeSelect.value;
        const types = [...new Set(liveRecords.map((record) => record.issue_type || 'task'))].sort();
        typeSelect.replaceChildren(option('All types', ''));
        types.forEach((type) => typeSelect.append(option(type, type)));
        if (types.includes(selected)) typeSelect.value = selected;
      }

      async function loadLiveBeads() {
        if (!citySelect.value) return;
        const request = ++liveRequest;
        refreshButton.disabled = true;
        eventLine.textContent = `Loading beads from ${citySelect.value}…`;
        const query = new URLSearchParams({ city: citySelect.value, limit: '100' });
        const agentQuery = new URLSearchParams({ city: citySelect.value, peek: 'true' });
        const agentsPromise = fetchJSON(`/api/agents?${agentQuery}`).catch(() => ({ items: liveAgents }));
        try {
          let data;
          let agentData;
          if (closedToggle.checked) {
            const allQuery = new URLSearchParams(query);
            allQuery.set('all', 'true');
            allQuery.set('limit', '40');
            const [allData, activeData, fetchedAgents] = await Promise.all([
              fetchJSON(`/api/beads?${allQuery}`),
              fetchJSON(`/api/beads?${query}`),
              agentsPromise
            ]);
            const records = new Map((allData.items || []).map((record) => [record.id, record]));
            (activeData.items || []).forEach((record) => records.set(record.id, record));
            data = { ...allData, items: [...records.values()] };
            agentData = fetchedAgents;
          } else {
            [data, agentData] = await Promise.all([fetchJSON(`/api/beads?${query}`), agentsPromise]);
          }
          if (request !== liveRequest || viewMode !== 'live') return;
          liveRecords = data.items || [];
          liveAgents = agentData.items || [];
          liveTotal = data.total ?? liveRecords.length;
          updateTypeOptions();
          applyLiveRecords();
        } catch (error) {
          eventLine.textContent = `Live city unavailable — ${error.message}`;
          motionNote.textContent = 'Connection error';
        } finally {
          refreshButton.disabled = false;
        }
      }

      function scheduleLiveRefresh() {
        clearInterval(liveTimer);
        if (viewMode === 'live') liveTimer = window.setInterval(loadLiveBeads, livePollMs);
      }

      function cancelShowcaseTweens() {
        const cancelled = tweens.splice(0);
        cancelled.forEach((activeTween) => activeTween.resolve());
      }

      async function advanceShowcase(epoch) {
        ensureShowcaseActive(epoch);
        const nextStep = showcaseStep + 1;
        const nextRecords = showcaseRecords(nextStep);
        await animateShowcaseTransition(nextRecords, nextStep, epoch);
        ensureShowcaseActive(epoch);
        showcaseStep = nextStep;
        liveRecords = nextRecords;
        liveTotal = liveRecords.length;
        updateTypeOptions();
        applyLiveRecords();
        scheduleShowcase();
      }

      function scheduleShowcase() {
        clearTimeout(showcaseTimer);
        if (viewMode !== 'showcase') return;
        const epoch = showcaseEpoch;
        showcaseTimer = window.setTimeout(() => {
          void advanceShowcase(epoch).catch((error) => {
            if (error === showcaseCancelled) return;
            eventLine.textContent = `Showcase animation stopped — ${error.message || error}`;
            motionNote.textContent = 'Animation error';
          });
        }, reducedMotion ? 80 : 900);
      }

      function setMode(mode) {
        showcaseEpoch += 1;
        if (viewMode === 'showcase') cancelShowcaseTweens();
        viewMode = mode;
        const live = mode === 'live';
        const showcase = mode === 'showcase';
        clearInterval(liveTimer);
        clearTimeout(showcaseTimer);
        citySelect.hidden = !live;
        refreshButton.hidden = !live;
        toolbar.hidden = !live;
        nextButton.hidden = mode !== 'demo';
        modeButton.textContent = mode === 'demo' ? 'Live city' : 'Demo events';
        showcaseButton.textContent = showcase ? 'Live city' : 'Showcase';
        tooltip.hidden = true;
        details.hidden = true;
        selectedBead = null;
        hoveredBead = null;
        if (live) {
          liveRecords = [];
          liveTotal = 0;
          void loadLiveBeads();
        } else if (showcase) {
          searchInput.value = '';
          typeSelect.value = '';
          showcaseStep = 0;
          liveRecords = showcaseRecords(showcaseStep);
          liveTotal = liveRecords.length;
          updateTypeOptions();
          applyLiveRecords();
          scheduleShowcase();
        } else {
          if (initialized && width) initializeScene();
          eventLine.textContent = 'Journal ready — advance one event at a time.';
          motionNote.textContent = reducedMotion ? 'Reduced motion' : 'Gravity on';
          nextButton.textContent = 'Run next event';
        }
        scheduleLiveRefresh();
      }

      async function initializeLiveViewer() {
        try {
          const [config, cities] = await Promise.all([fetchJSON('/api/config'), fetchJSON('/api/cities')]);
          citySelect.replaceChildren();
          (cities.items || []).forEach((city) => {
            const cityOption = option(city.name, city.name);
            cityOption.disabled = city.running === false;
            citySelect.append(cityOption);
          });
          if (!citySelect.options.length) throw new Error('No running cities found');
          const requestedCity = new URLSearchParams(location.search).get('city');
          const preferredCity = requestedCity || config.defaultCity;
          if (preferredCity && [...citySelect.options].some((option) => option.value === preferredCity)) {
            citySelect.value = preferredCity;
          }
          setMode(new URLSearchParams(location.search).get('showcase') === '1' ? 'showcase' : 'live');
        } catch (error) {
          setMode('demo');
          eventLine.textContent = `Demo mode · ${error.message}`;
        }
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * width / rect.width,
          y: (event.clientY - rect.top) * height / rect.height
        };
      }

      function beadAtPoint(point) {
        return [...beads].reverse().find((bead) => {
          if (!bead.visible) return false;
          return Math.hypot(point.x - bead.x, point.y - bead.y) <= bead.radius * bead.scale + 7;
        }) || null;
      }

      function showTooltip(bead) {
        const record = bead.record;
        const activity = liveActivityByBead.get(bead.id);
        const lines = [
          element('span', '', `${record.id} · ${record.issue_type || 'task'}${record.priority === undefined || record.priority === null ? '' : ` · P${record.priority}`}`),
          element('strong', '', record.title || record.id),
          element('span', '', `${record.status || bead.status}${record.assignee ? ` · ${record.assignee}` : ''}`)
        ];
        if (activity) lines.push(element('span', '', `ACTIVE · ${activity.name} · ${activity.state}`));
        tooltip.replaceChildren(...lines);
        tooltip.hidden = false;
        const maxLeft = Math.max(10, width - Math.min(310, width - 20) - 10);
        tooltip.style.left = `${Math.max(10, Math.min(bead.x + 12, maxLeft))}px`;
        tooltip.style.top = `${Math.max(10, bead.y - 64)}px`;
      }

      function detailSection(title) {
        const section = element('section', 'bef-details-section');
        section.append(element('h4', '', title));
        return section;
      }

      function addDetailField(list, label, value) {
        list.append(element('dt', '', label), element('dd', '', value || '—'));
      }

      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        return Number.isNaN(date.valueOf()) ? value : date.toLocaleString();
      }

      function renderDetails(record, deps = { children: [] }) {
        detailsID.textContent = record.id;
        detailsTitle.textContent = record.title || record.id;
        detailsBody.replaceChildren();

        const facts = detailSection('Record');
        const grid = element('dl', 'bef-detail-grid');
        addDetailField(grid, 'Status', record.status);
        addDetailField(grid, 'Type', record.issue_type || 'task');
        addDetailField(grid, 'Priority', record.priority === undefined || record.priority === null ? '—' : `P${record.priority}`);
        addDetailField(grid, 'Assignee', record.assignee);
        addDetailField(grid, 'Created', formatDate(record.created_at));
        addDetailField(grid, 'Updated', formatDate(record.updated_at));
        addDetailField(grid, 'Deferred', formatDate(record.defer_until));
        addDetailField(grid, 'Parent', record.parent);
        facts.append(grid);
        detailsBody.append(facts);

        const activity = liveActivityByBead.get(record.id);
        if (activity) {
          const liveActivity = detailSection('Live activity');
          liveActivity.append(element('p', '', `${activity.name} · ${activity.state} · actively producing output`));
          detailsBody.append(liveActivity);
        }

        if (record.description) {
          const description = detailSection('Description');
          description.append(element('p', '', record.description));
          detailsBody.append(description);
        }

        const labels = detailSection('Labels');
        const chips = element('div', 'bef-chips');
        (record.labels || []).forEach((label) => chips.append(element('span', 'bef-chip', label)));
        labels.append(chips.childElementCount ? chips : element('p', '', 'No labels.'));
        detailsBody.append(labels);

        const relationships = detailSection('Relationships');
        const relationshipLines = [];
        (record.dependencies || []).forEach((dependency) => {
          relationshipLines.push(`${dependency.type || 'depends on'} · ${dependency.depends_on_id || dependency.depends_on || 'unknown'}`);
        });
        (deps.children || []).forEach((child) => relationshipLines.push(`child · ${child.id} · ${child.title}`));
        relationships.append(element('p', '', relationshipLines.length ? relationshipLines.join('\n') : 'No relationships returned.'));
        detailsBody.append(relationships);

        const metadataEntries = Object.entries(record.metadata || {}).sort(([left], [right]) => left.localeCompare(right));
        if (metadataEntries.length) {
          const metadata = detailSection(`Metadata · ${metadataEntries.length}`);
          const table = element('table', 'bef-metadata');
          const body = document.createElement('tbody');
          metadataEntries.forEach(([key, value]) => {
            const row = document.createElement('tr');
            row.append(element('th', '', key), element('td', '', value));
            body.append(row);
          });
          table.append(body);
          metadata.append(table);
          detailsBody.append(metadata);
        }
      }

      async function selectBead(bead) {
        selectedBead = bead;
        details.hidden = false;
        renderDetails(bead.record);
        draw();
        if (viewMode !== 'live') return;
        const selectionID = bead.id;
        const query = new URLSearchParams({ city: citySelect.value });
        try {
          const [record, deps] = await Promise.all([
            fetchJSON(`/api/bead/${encodeURIComponent(selectionID)}?${query}`),
            fetchJSON(`/api/bead/${encodeURIComponent(selectionID)}/deps?${query}`).catch(() => ({ children: [] }))
          ]);
          if (selectedBead?.id === selectionID) renderDetails(record, deps);
        } catch (error) {
          if (selectedBead?.id === selectionID) {
            const failure = detailSection('Unable to load details');
            failure.append(element('p', '', error.message));
            detailsBody.append(failure);
          }
        }
      }

      const events = [
        { label: '<strong>create</strong> · b-31 enters the open queue', run: spawnOpen },
        { label: '<strong>update · claim</strong> · b-31 moves open → in progress', run: claimOpenBead },
        { label: '<strong>update · unclaim</strong> · b-31 returns to open', run: unclaimBead },
        { label: '<strong>dep_add</strong> · b-31 gains a blocking dependency', run: addBlockingDependency },
        { label: '<strong>dep_remove + update</strong> · b-14 becomes ready', run: releaseBlocked },
        { label: '<strong>update · defer</strong> · b-22 moves out of the active queue', run: deferBead },
        { label: '<strong>update · wake</strong> · b-22 returns to open', run: wakeDeferredBead },
        { label: '<strong>close</strong> · b-17 is carried to completed', run: transferOpenToClosed },
        { label: '<strong>close · failure reason</strong> · b-08 drops to the failed-close rut', run: rejectWork },
        { label: '<strong>update · reopen</strong> · b-02 returns to open', run: reopenBead },
        { label: '<strong>delete</strong> · b-03 is removed', run: deleteBead },
        { label: '<strong>comment</strong> · b-22 receives a new note', run: commentOnBead }
      ];

      async function runNextEvent() {
        if (step >= events.length) initializeScene();
        const event = events[step];
        nextButton.disabled = true;
        motionNote.textContent = 'Physics running';
        eventLine.innerHTML = `Event ${step + 1} of ${events.length} — ${event.label}`;
        await event.run();
        step += 1;
        nextButton.disabled = false;
        nextButton.textContent = step >= events.length ? 'Replay events' : 'Run next event';
        motionNote.textContent = reducedMotion ? 'Reduced motion' : 'Gravity on';
        draw();
      }

      nextButton.addEventListener('click', runNextEvent);
      refreshButton.addEventListener('click', loadLiveBeads);
      showcaseButton.addEventListener('click', () => setMode(viewMode === 'showcase' ? 'live' : 'showcase'));
      modeButton.addEventListener('click', () => setMode(viewMode === 'demo' ? 'live' : 'demo'));
      citySelect.addEventListener('change', () => {
        const url = new URL(location.href);
        url.searchParams.set('city', citySelect.value);
        history.replaceState(null, '', url);
        void loadLiveBeads();
      });
      closedToggle.addEventListener('change', loadLiveBeads);
      searchInput.addEventListener('input', applyLiveRecords);
      typeSelect.addEventListener('change', applyLiveRecords);
      detailsClose.addEventListener('click', closeDetails);
      canvas.addEventListener('pointermove', (event) => {
        const bead = beadAtPoint(canvasPoint(event));
        if (bead === hoveredBead) return;
        hoveredBead = bead;
        canvas.style.cursor = bead ? 'pointer' : 'default';
        if (bead) showTooltip(bead);
        else tooltip.hidden = true;
        draw();
      });
      canvas.addEventListener('pointerleave', () => {
        hoveredBead = null;
        tooltip.hidden = true;
        canvas.style.cursor = 'default';
        draw();
      });
      canvas.addEventListener('click', (event) => {
        const bead = beadAtPoint(canvasPoint(event));
        if (bead) void selectBead(bead);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !details.hidden) closeDetails();
      });
      new ResizeObserver(resize).observe(stage);
      new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style'] });
      void initializeLiveViewer();
    })();
  </script>
</div>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
