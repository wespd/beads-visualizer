name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # Hosted runners are noisy; each refresh still has a hard 3s timeout.
          STRESS_MAX_REFRESH_MS: 2500
