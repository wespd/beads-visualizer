name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          # Average refresh latency and animation completion are separate checks.
          STRESS_MAX_REFRESH_MS: 2500
          STRESS_JOURNAL_TIMEOUT_MS: 30000
